[package]
name = "waft"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
tokio = { version = "1.40", features = ["full", "test-util"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
blake3 = "1.5"
socket2 = "0.6"
arboard = "3.4"
clap = { version = "4.5", features = ["derive"] }
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap_complete = "4.5"
rand_core = { version = "0.6", features = ["getrandom"]}
memmap2 = "0.9"

# Optional internet fallback transport and signaling server.
base64 = { version = "0.22", optional = true }
bytes = { version = "1.10", optional = true }
futures-util = { version = "0.3", optional = true }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"], optional = true }
uuid = { version = "1.16", features = ["serde", "v4"], optional = true }
webrtc = { version = "0.14", optional = true }


[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["fs", "socket", "uio"] }
libc = "0.2"

[dev-dependencies]
criterion = "0.8"

[features]
default = []
internet = ["base64", "bytes", "futures-util", "tokio-tungstenite", "uuid", "webrtc"]

[[bench]]
name = "bench_transfer"
harness = false



[lints.rust]
unsafe_code = "deny"
unused_imports = "warn"
dead_code = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
pedantic = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
